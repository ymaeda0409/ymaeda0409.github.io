name: malawi_bento_customer
description: "Malawi Bento customer app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  bento_core:
    path: ../packages/bento_core
  cached_network_image: ^4.0.3
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  google_maps_flutter: ^2.18.2
  intl: ^0.20.3
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  # Catalog captured from the real API, used only by DEMO_MODE builds.
  assets:
    - assets/demo/
    - assets/demo/menu/
  # Noto Sans JP (SIL OFL 1.1, assets/fonts/OFL.txt), subset to the Japanese
  # characters in app_ja.arb and the demo catalog; others fall back to system fonts.
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
