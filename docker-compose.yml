# Development stack: docker compose up -d
#   API:      http://localhost:8080/api
#   Postgres: localhost:5432 (bento / secret)
#   Redis:    localhost:6379
services:
  app:
    build: ./backend
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    build: ./backend
    command: php artisan queue:work redis --tries=3 --backoff=10
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - app

  # Runs `deliveries:dispatch` every minute (expired offers → next driver).
  scheduler:
    build: ./backend
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: malawi_bento
      POSTGRES_USER: bento
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bento -d malawi_bento"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
