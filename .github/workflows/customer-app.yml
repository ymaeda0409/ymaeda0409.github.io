name: customer-app

on:
  push:
    paths: ['customer-app/**', '.github/workflows/customer-app.yml']
  pull_request:
    paths: ['customer-app/**', '.github/workflows/customer-app.yml']

defaults:
  run:
    working-directory: customer-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - run: flutter pub get
      - name: Generated localizations are up to date
        run: flutter gen-l10n && git diff --exit-code -- lib/l10n/generated
      - run: flutter analyze
      - run: flutter test
