name: backend

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: malawi_bento_test
          POSTGRES_USER: bento
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bento" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, intl, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Kitchen / admin UI tests (Vitest)
        run: npm test
        env:
          # laravel-vite-plugin refuses to start its dev server in CI; Vitest loads the
          # same config but never serves, so the check does not apply.
          LARAVEL_BYPASS_ENV_CHECK: 1
      - name: Build assets
        run: npm run build
      - name: Tests (SQLite)
        run: php artisan test
      - name: Tests (PostgreSQL)
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: malawi_bento_test
          DB_USERNAME: bento
          DB_PASSWORD: secret
